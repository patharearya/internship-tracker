name: update

on:
  schedule:
    - cron: "17 * * * *"   # hourly run
    - cron: "5 6 * * *"    # daily discovery from the Simplify list, before that hour's run
  workflow_dispatch:
    inputs:
      discover:
        description: "Rebuild the board list first"
        type: boolean
        default: false

# never two runs at once: they would race on data/
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
    steps:
      # the branch head, not the triggering commit: a run queued behind an 81-min Workday run would otherwise
      # compare against stale data and conflict on push (devlog 2026-10-04)
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Discover boards
        if: github.event.schedule == '5 6 * * *' || inputs.discover
        run: ./mvnw -q -B compile exec:java -Dexec.mainClass=io.github.patharearya.internships.Main -Dexec.args=discover

      - name: Fetch, filter, compare
        run: ./mvnw -q -B compile exec:java -Dexec.mainClass=io.github.patharearya.internships.Main -Dexec.args=run

      # every rejection with its reason; too big to commit hourly, kept 90 days here
      - uses: actions/upload-artifact@v7
        with:
          name: rejections-${{ github.run_id }}
          path: data/rejections.tsv
          retention-days: 90

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data   # rejections.tsv is gitignored
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
